<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chelsea News Korean</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f5f7;
            color: #171717;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        header {
            background: #111827;
            color: white;
            padding: 24px 20px;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 7px;
            color: #cbd5e1;
            font-size: 14px;
        }

        nav {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            overflow-x: auto;
        }

        nav button {
            border: 0;
            padding: 9px 15px;
            border-radius: 7px;
            background: #374151;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        nav button.active {
            background: white;
            color: #111827;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 20px;
        }

        .top h1 {
            margin: 0;
            font-size: 25px;
        }

        .updated {
            color: #777;
            font-size: 13px;
        }

        #status {
            padding: 30px;
            text-align: center;
            color: #777;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .news-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            transition: box-shadow 0.2s;
        }

        .news-card:hover {
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
        }

        .news-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: #777;
        }

        .badge {
            background: #e8eefc;
            color: #334155;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .news-title {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .news-description {
            color: #555;
            line-height: 1.65;
            font-size: 14px;
        }

        .source {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #eee;

            display: flex;
            justify-content: space-between;
            align-items: center;

            color: #777;
            font-size: 13px;
        }

        .source a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .source a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .top {
                display: block;
            }

            .updated {
                margin-top: 8px;
            }

            .news-card {
                padding: 16px;
            }

            .news-title {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">Chelsea News Korean</div>

        <div class="subtitle">
            첼시 관련 해외 뉴스를 한국어로 정리합니다.
        </div>

        <nav>
            <button class="active">전체</button>
            <button>이적시장</button>
            <button>영입</button>
            <button>방출</button>
            <button>팀 소식</button>
        </nav>
    </div>
</header>

<main>

    <div class="top">
        <h1>첼시 최신 뉴스</h1>
        <div class="updated" id="updated">
            뉴스 불러오는 중...
        </div>
    </div>

    <div id="status">
        해외 뉴스를 불러오는 중입니다.
    </div>

    <div class="news-list" id="newsList"></div>

</main>

<script>
    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text || "";
        return div.innerHTML;
    }

    function decodeHtml(text) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = text || "";
        return textarea.value;
    }

    function formatDate(dateString) {
        const date = new Date(dateString);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleString("ko-KR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    async function loadNews() {
        const status = document.getElementById("status");
        const newsList = document.getElementById("newsList");
        const updated = document.getElementById("updated");

        try {
            const response = await fetch("/api/news");

            if (!response.ok) {
                throw new Error("뉴스 API 요청 실패");
            }

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || "뉴스를 불러오지 못했습니다.");
            }

            newsList.innerHTML = "";

            if (!data.news || data.news.length === 0) {
                status.textContent = "현재 표시할 Chelsea 뉴스가 없습니다.";
                return;
            }

            status.style.display = "none";

            data.news.forEach((news) => {
                const card = document.createElement("article");

                card.className = "news-card";

                const title = decodeHtml(news.title);
                const description = decodeHtml(news.description);
                const link = decodeHtml(news.link);

                card.innerHTML = `
                    <div class="news-meta">
                        <span class="badge">Chelsea</span>
                        <span>${escapeHtml(formatDate(news.pubDate))}</span>
                    </div>

                    <div class="news-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="news-description">
                        ${escapeHtml(description)}
                    </div>

                    <div class="source">
                        <span>출처: ${escapeHtml(data.source)}</span>

                        <a
                            href="${escapeHtml(link)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            원문 보기
                        </a>
                    </div>
                `;

                newsList.appendChild(card);
            });

            updated.textContent =
                `마지막 업데이트 ${new Date().toLocaleTimeString("ko-KR", {
                    hour: "2-digit",
                    minute: "2-digit"
                })}`;

        } catch (error) {
            console.error(error);

            status.textContent =
                "뉴스를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";

            updated.textContent = "업데이트 실패";
        }
    }

    loadNews();

    // 5분마다 자동 새로고침
    setInterval(loadNews, 5 * 60 * 1000);
</script>

</body>
</html>
